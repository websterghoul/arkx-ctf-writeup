<!doctype html>
<html><head><meta charset="utf-8"><title>capture verification sheet</title>
<style>
 body{background:#111;color:#0f0;font:12px monospace;margin:0;padding:8px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
 figure{margin:0;background:#000;border:1px solid #444}
 img{width:100%;display:block}
 figcaption{padding:3px 5px;color:#8f8;font-size:11px}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const names = (new URLSearchParams(location.search).get('n') || '').split(',').filter(Boolean);
const g = document.getElementById('g');
for (const n of names) {
  const f = document.createElement('figure');
  f.innerHTML = `<img src="${n}"><figcaption>${n}</figcaption>`;
  g.appendChild(f);
}
</script>
</body></html>
